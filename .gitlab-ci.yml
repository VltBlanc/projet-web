stages:
  - lint
  - test
  - build

# ── LINT STAGE ──
lint-code:
  stage: lint
  image: denoland/deno:alpine
  script:
    - deno lint backend/src frontend/front_server.ts

# ── TEST STAGE ──
test-backend:
  stage: test
  image: denoland/deno:alpine
  script:
    - cd backend
    - deno test --allow-read --allow-net --allow-env src/*.test.ts

test-frontend:
  stage: test
  image: denoland/deno:alpine
  script:
    - cd frontend
    - deno cache front_server.ts

# ── BUILD STAGE (Push to Container Registry) ──
# Note: Requires a GitLab Runner with Docker-in-Docker (dind) enabled
build-backend:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA -t $CI_REGISTRY_IMAGE/backend:latest ./backend
    - docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/backend:latest
  only:
    - main

build-frontend:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA -t $CI_REGISTRY_IMAGE/frontend:latest ./frontend
    - docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA
    - docker push $CI_REGISTRY_IMAGE/frontend:latest
  only:
    - main
